# Dataset seeds — verified via Hugging Face Hub connector on 2026-10-17.
# license = the license tag on the dataset card (evidence = the card URL).
# finetune_splits: splits allowed into fine-tuning data. Every other split is eval-only.
# Benchmarks used for evaluation have finetune_splits: [] so nothing leaks into training.
# priority: P1 essential prototype, P2 evaluation, P3 fine-tuning, P4 optional.

datasets:
  - id: ds-squad-v2
    hf_id: rajpurkar/squad_v2
    title: SQuAD 2.0
    license: cc-by-sa-4.0
    license_tier: open
    role: RAG reader eval, unanswerable-question handling (abstention)
    topics: [rag, evaluation-metrics]
    finetune_splits: []
    priority: P4
    notes: Wikipedia, not NLP-course content; use only to test abstention.

  - id: ds-squad-v1
    hf_id: rajpurkar/squad
    title: SQuAD 1.1
    license: cc-by-sa-4.0
    license_tier: open
    role: Extractive QA reference; course exercise material (students implement QA)
    topics: [rag, evaluation-metrics]
    finetune_splits: []
    priority: P4

  - id: ds-natural-questions
    hf_id: google-research-datasets/natural_questions
    title: Natural Questions
    license: cc-by-sa-3.0
    license_tier: open
    role: Open-domain QA reference only
    topics: [rag]
    finetune_splits: []
    priority: P4
    notes: Very large download; check repo size before pulling. Low relevance to course content.

  - id: ds-sciq
    hf_id: allenai/sciq
    title: SciQ
    license: cc-by-nc-3.0
    license_tier: noncommercial
    role: MCQ + distractor-generation examples (format reference)
    topics: [evaluation-metrics]
    finetune_splits: [train]
    priority: P3

  - id: ds-mmlu
    hf_id: cais/mmlu
    title: MMLU
    license: mit
    license_tier: open
    role: Eval — machine_learning, college_computer_science, college_mathematics subsets
    topics: [evaluation-metrics, advanced]
    finetune_splits: []
    priority: P2
    is_benchmark: true

  - id: ds-mmlu-pro
    hf_id: TIGER-Lab/MMLU-Pro
    title: MMLU-Pro
    license: mit
    license_tier: open
    role: Eval — computer science / math categories, harder 10-option MCQ
    topics: [evaluation-metrics, advanced]
    finetune_splits: []
    priority: P2
    is_benchmark: true

  - id: ds-gsm8k
    hf_id: openai/gsm8k
    title: GSM8K
    license: mit
    license_tier: open
    role: Step-by-step reasoning format; eval of arithmetic reasoning
    topics: [evaluation-metrics]
    finetune_splits: [train]
    priority: P3
    is_benchmark: true

  - id: ds-math
    hf_id: EleutherAI/hendrycks_math
