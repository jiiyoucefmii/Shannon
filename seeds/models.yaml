# Model seeds — checked on the Hugging Face Hub via the connector, 2026-10-17.
# Parameter counts and licenses are from the Hub metadata. Fetch model cards + configs only (no weights).
# Benchmarks: read from each model card; do NOT compare scores across different benchmark versions.

tutor_candidates:
  lightweight:   # fits one 24 GB GPU in 4-bit; QLoRA fine-tuning feasible on a single GPU
    - {hf_id: Qwen/Qwen3.5-9B, license: apache-2.0, note: "base model Qwen/Qwen3.5-9B-Base also available"}
    - {hf_id: Qwen/Qwen3.5-4B, license: apache-2.0, note: "smallest sensible baseline"}
    - {hf_id: mistralai/Ministral-3-8B-Instruct-2512, license: apache-2.0, note: "card says FP8 weights; base Ministral-3-8B-Base-2512"}
    - {hf_id: meta-llama/Llama-3.1-8B-Instruct, license: llama3.1, note: "gated: accept license on HF before download; older generation"}
  medium:
    - {hf_id: Qwen/Qwen3.8-27B, license: apache-2.0, params: "27.8B", note: "dense; QLoRA needs ~48 GB-class GPU"}
    - {hf_id: Qwen/Qwen3.6-35B-A3B, license: apache-2.0, params: "36.0B total (MoE, ~3B active per name)", note: "fast inference; MoE fine-tuning is harder"}
    - {hf_id: mistralai/Mistral-Small-3.1-24B-Instruct-2503, license: "not verified", note: "check card license"}
  large_reference:   # use via an inference provider/API, not self-hosted
    - {hf_id: deepseek-ai/DeepSeek-V4.1-Flash, license: mit, params: "763B", note: "reference baseline only"}
  reasoning_distill:
    - {hf_id: deepseek-ai/DeepSeek-R1-Distill-Qwen-7B, license: mit}

retrieval:
  embeddings:
    - {hf_id: BAAI/bge-m3, license: mit, note: "dense + sparse + multi-vector in one model; hybrid-ready"}
    - {hf_id: Qwen/Qwen3-Embedding-0.6B, license: apache-2.0, params: "0.6B"}
  rerankers:
    - {hf_id: BAAI/bge-reranker-v2-m3, license: apache-2.0, params: "0.57B"}
    - {hf_id: Qwen/Qwen3-Reranker-4B, license: apache-2.0}

safety:
  - {hf_id: meta-llama/Llama-Prompt-Guard-2-86M, license: other, note: "prompt-injection classifier for retrieved chunks; gated"}

# Note: several recent Qwen/DeepSeek checkpoints are tagged image-text-to-text (multimodal). They still serve text;
# confirm chat template and text-only loading in each card before evaluation.
